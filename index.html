<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任意门 / Anywhere Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a12;
  --accent: #e94560;
  --accent2: #ff6b81;
  --gold: #f0c27f;
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --door-pink: #ff4081;
  --door-frame: #c2185b;
  --door-glow: rgba(233, 69, 96, 0.4);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Serif SC', 'Playfair Display', Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

/* ── Stars ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9), transparent),
    radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.8), transparent);
  background-size: 200px 200px;
  animation: twinkle 8s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

@keyframes twinkle {
  0% { opacity: 0.3; }
  50% { opacity: 0.6; }
  100% { opacity: 0.4; }
}

/* ══════════════════════════════════════
   LANDING PAGE
   ══════════════════════════════════════ */
#landing {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}

#landing.hidden {
  opacity: 0;
  pointer-events: none;
}

/* ── Door illustration ── */
.door-wrapper {
  position: relative;
  cursor: pointer;
  margin-bottom: 2.5rem;
  perspective: 800px;
  /* clicking the door = submitting the search */
}

.door-frame {
  width: 160px;
  height: 240px;
  background: var(--door-frame);
  border-radius: 20px 20px 6px 6px;
  padding: 8px 8px 6px;
  box-shadow:
    0 0 60px var(--door-glow),
    0 0 120px rgba(233, 69, 96, 0.15);
  animation: doorFloat 4s ease-in-out infinite;
  position: relative;
  transform-style: preserve-3d;
}

.door-body {
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, var(--door-pink), #e91e63);
  border-radius: 14px 14px 3px 3px;
  position: relative;
  overflow: hidden;
  transform-origin: left center;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
}

/* Portal light behind the door — revealed when door cracks open */
.door-crack-light {
  position: absolute;
  inset: 8px 8px 6px 8px;
  border-radius: 14px 14px 3px 3px;
  background: radial-gradient(ellipse at 80% 50%,
    rgba(220, 235, 255, 1) 0%,
    rgba(200, 220, 255, 0.8) 30%,
    rgba(180, 210, 255, 0.5) 60%,
    rgba(160, 200, 255, 0.2) 100%);
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 0;
}

.door-wrapper.has-text .door-crack-light {
  animation: crackLightBreathe 2.8s ease-in-out infinite;
}

@keyframes crackLightBreathe {
  0%, 100% { opacity: 0; }
  40% { opacity: 0.6; }
  50% { opacity: 1; }
  60% { opacity: 0.6; }
}

/* When input has text, door panel breathes open and closed */
.door-wrapper.has-text .door-body {
  animation: doorBreathe 2.8s ease-in-out infinite;
}

@keyframes doorBreathe {
  0%, 100% { transform: rotateY(0deg); }
  50% { transform: rotateY(-9deg); }
}

/* Right-side light spill from the crack (opening edge = widest gap) */
.door-crack-spill {
  position: absolute;
  top: 8px;
  right: 4px;
  bottom: 6px;
  width: 8px;
  border-radius: 0 14px 3px 0;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 2;
  pointer-events: none;
  box-shadow:
    4px 0 15px 4px rgba(200, 220, 255, 0.8),
    8px 0 30px 6px rgba(200, 220, 255, 0.4);
}

/* Top light spill — wedge shape: thin at hinge (left), tall at opening (right) */
.door-crack-spill::before {
  content: '';
  position: absolute;
  top: -14px;
  left: -140px;
  right: -6px;
  height: 14px;
  background: linear-gradient(to right,
    rgba(200, 220, 255, 0) 0%,
    rgba(200, 220, 255, 0.15) 40%,
    rgba(200, 220, 255, 0.5) 70%,
    rgba(220, 235, 255, 0.8) 100%);
  clip-path: polygon(100% 0%, 100% 100%, 30% 100%, 70% 0%);
  filter: blur(3px);
}

/* Bottom light spill — wedge shape: thin at hinge (left), tall at opening (right) */
.door-crack-spill::after {
  content: '';
  position: absolute;
  bottom: -12px;
  left: -140px;
  right: -6px;
  height: 12px;
  background: linear-gradient(to right,
    rgba(200, 220, 255, 0) 0%,
    rgba(200, 220, 255, 0.1) 40%,
    rgba(200, 220, 255, 0.35) 70%,
    rgba(220, 235, 255, 0.6) 100%);
  clip-path: polygon(70% 100%, 30% 0%, 100% 0%, 100% 100%);
  filter: blur(3px);
}

.door-wrapper.has-text .door-crack-spill {
  animation: spillBreathe 2.8s ease-in-out infinite;
}

@keyframes spillBreathe {
  0%, 100% { opacity: 0; }
  40% { opacity: 0.5; }
  50% { opacity: 1; }
  60% { opacity: 0.5; }
}

/* Subtle inner shadow on right edge of frame for depth */
.door-wrapper.has-text .door-frame {
  animation: frameBreathe 2.8s ease-in-out infinite;
}

@keyframes frameBreathe {
  0%, 100% {
    box-shadow:
      0 0 60px var(--door-glow),
      0 0 120px rgba(233, 69, 96, 0.15);
  }
  50% {
    box-shadow:
      0 0 60px var(--door-glow),
      0 0 120px rgba(233, 69, 96, 0.15),
      inset -4px 0 8px rgba(0, 0, 0, 0.3),
      4px 0 20px rgba(200, 220, 255, 0.4);
  }
}

/* inner panel lines */
.door-body::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 10px 10px 2px 2px;
}

/* door handle — round brass knob */
.door-handle {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6d5, #f0c27f 40%, #c9953c 75%, #8b6914);
  box-shadow:
    0 0 8px rgba(240, 194, 127, 0.5),
    0 2px 4px rgba(0,0,0,0.4),
    inset 0 1px 2px rgba(255,255,255,0.4);
  z-index: 5;
  cursor: pointer;
  transition: filter 0.2s;
}

.door-handle:hover { filter: brightness(1.15); }
.door-handle:active { filter: brightness(0.95); }

/* subtle light beam from under the door */
.door-frame::after {
  content: '';
  position: absolute;
  bottom: -30px;
  left: 10%;
  width: 80%;
  height: 30px;
  background: radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 80%);
}


@keyframes doorFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.door-label {
  text-align: center;
  margin-top: 1.2rem;
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.3;
  pointer-events: none;
}

.door-label .en {
  display: block;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 0.45em;
  font-weight: 400;
  font-style: italic;
  opacity: 0.8;
  margin-top: 0.15em;
  background: linear-gradient(135deg, var(--gold), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Search input ── */
.search-row {
  width: 60%;
  max-width: 420px;
  margin: 0 auto;
}

.search-row form {
  display: flex;
  align-items: center;
  background: rgba(18, 18, 31, 0.85);
  border-radius: 60px;
  border: 2px solid rgba(233, 69, 96, 0.25);
  overflow: visible;
  transition: border-color 0.3s, box-shadow 0.3s;
  backdrop-filter: blur(12px);
  padding-right: 0.55rem;
}

.search-row form:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 40px var(--door-glow);
}

.search-row input {
  flex: 1;
  padding: 1rem 1.5rem;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 1.1rem;
  outline: none;
}

.search-row input::placeholder { color: var(--text-dim); }

.search-row input {
  border-radius: 60px;
}

/* Open button inside input */
.open-btn {
  flex-shrink: 0;
  padding: 0.55rem 1.4rem;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #D4AF5A, #C9A84C, #B8943F);
  color: #fff;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  opacity: 0;
  max-width: 0;
  overflow: hidden;
  transition: opacity 0.3s ease, max-width 0.3s ease, padding 0.3s ease, box-shadow 0.2s ease;
  padding: 0;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(201, 168, 76, 0.3);
}

.open-btn.visible {
  opacity: 1;
  max-width: 100px;
  padding: 0.55rem 1.4rem;
}

.open-btn:hover {
  box-shadow: 0 4px 16px rgba(201, 168, 76, 0.5);
}

.open-btn:active {
  filter: brightness(0.92);
}

.hint {
  text-align: center;
  margin-top: 0.8rem;
  color: var(--text-dim);
  font-size: 0.8rem;
  font-style: italic;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.hint.fading { opacity: 0; }

/* ══════════════════════════════════════
   DOOR‑OPEN ANIMATION OVERLAY
   ══════════════════════════════════════ */
#doorAnim {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: var(--bg);
}

#doorAnim.active { display: block; }

/* the visible door centred on screen that will swing open */
.anim-scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1200px;
}

.anim-door-frame {
  width: 280px;
  height: 420px;
  position: relative;
  transform-style: preserve-3d;
  overflow: visible;
  opacity: 0;
  transform: scale(0.3);
  transition: opacity 0.5s ease-out, transform 0.5s ease-out;
}

#doorAnim.entrance .anim-door-frame {
  opacity: 1;
  transform: scale(1);
}

/* door frame border — FRONT layer, always on top */
.anim-door-frame::before {
  content: '';
  position: absolute;
  inset: -10px;
  border: 10px solid var(--door-frame);
  border-radius: 22px 22px 8px 8px;
  pointer-events: none;
  z-index: 3;
  transition: border-color 0.8s ease, box-shadow 0.8s ease;
}

/* Frame glows white/blue-white when door is open */
#doorAnim.swing .anim-door-frame::before {
  border-color: rgba(220, 235, 255, 0.9);
  box-shadow:
    0 0 15px rgba(220, 235, 255, 0.8),
    0 0 40px rgba(200, 220, 255, 0.5),
    0 0 80px rgba(180, 210, 255, 0.3),
    inset 0 0 15px rgba(255, 255, 255, 0.6);
}

/* ── Portal opening: sits INSIDE/BEHIND the door frame ── */
.anim-portal {
  position: absolute;
  inset: -2px;
  border-radius: 14px 14px 4px 4px;
  overflow: visible;
  z-index: 0;
  background: #fff;
}

/* pure white light filling the entire portal opening */
.anim-portal-glow {
  position: absolute;
  inset: -8px;
  background: #fff;
  opacity: 0;
  transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow:
    0 0 40px 20px rgba(255, 255, 255, 0.9),
    0 0 80px 40px rgba(220, 235, 255, 0.6),
    0 0 150px 60px rgba(200, 220, 255, 0.3);
}

/* very subtle cool shimmer layer */
.anim-portal-glow::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(220, 235, 255, 0.3) 0%,
    rgba(255, 255, 255, 0) 30%,
    rgba(255, 255, 255, 0) 70%,
    rgba(220, 235, 255, 0.2) 100%);
  animation: portalPulse 3s ease-in-out infinite alternate;
  opacity: 0;
  transition: opacity 1.2s ease 0.3s;
}

@keyframes portalPulse {
  0% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* light leak around the door edges — visible before door fully opens */
.anim-light-leak {
  position: absolute;
  inset: -6px;
  border-radius: 18px 18px 6px 6px;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.6s ease;
  box-shadow:
    inset 0 0 30px rgba(255, 255, 255, 0.9),
    0 0 30px rgba(255, 255, 255, 0.8),
    0 0 60px rgba(230, 240, 255, 0.6),
    0 0 120px rgba(220, 235, 255, 0.3);
  pointer-events: none;
}

/* ── God rays emanating from the portal ── */
.anim-ray {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 4px;
  height: 500px;
  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.25) 20%,
    rgba(230, 240, 255, 0.15) 50%,
    rgba(220, 235, 255, 0.05) 80%,
    transparent 100%
  );
  transform-origin: top center;
  opacity: 0;
  z-index: 1;
  pointer-events: none;
  filter: blur(3px);
  transition: opacity 0.8s ease 0.3s;
}

.anim-ray:nth-child(1) { transform: translate(-50%, 0) rotate(-50deg); width: 5px; height: 450px; }
.anim-ray:nth-child(2) { transform: translate(-50%, 0) rotate(-25deg); width: 3px; height: 550px; }
.anim-ray:nth-child(3) { transform: translate(-50%, 0) rotate(5deg); width: 6px; height: 500px; }
.anim-ray:nth-child(4) { transform: translate(-50%, 0) rotate(35deg); width: 4px; height: 480px; }
.anim-ray:nth-child(5) { transform: translate(-50%, 0) rotate(60deg); width: 3px; height: 520px; }
.anim-ray:nth-child(6) { transform: translate(-50%, 0) rotate(-70deg); width: 5px; height: 460px; }

#doorAnim.swing .anim-ray {
  opacity: 1;
  animation: rayPulse 2s ease-in-out infinite alternate;
}

.anim-ray:nth-child(2) { animation-delay: 0.3s; }
.anim-ray:nth-child(3) { animation-delay: 0.6s; }
.anim-ray:nth-child(4) { animation-delay: 0.15s; }
.anim-ray:nth-child(5) { animation-delay: 0.45s; }
.anim-ray:nth-child(6) { animation-delay: 0.75s; }

@keyframes rayPulse {
  0% { opacity: 0.5; }
  100% { opacity: 1; }
}

/* single door panel — hinges on the left, ABOVE the portal */
.anim-panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, var(--door-pink), #c2185b);
  backface-visibility: hidden;
  transition: transform 1.1s cubic-bezier(0.16, 0.9, 0.4, 1);
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  border-radius: 14px 14px 4px 4px;
  transform-origin: left center;
  transform: rotateY(0deg);
  z-index: 2;
}

/* inner panel line */
.anim-panel::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 10px 10px 2px 2px;
}

/* round knob on the animation panel */
.anim-panel::after {
  content: '';
  position: absolute;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6d5, #f0c27f 40%, #c9953c 75%, #8b6914);
  box-shadow: 0 0 8px rgba(240, 194, 127, 0.5), 0 2px 4px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.4);
}

/* ── Opening states ── */

/* Light leaks start early — as soon as door begins to move */
#doorAnim.swing .anim-light-leak {
  opacity: 1;
}

/* Door swings open revealing the portal */
#doorAnim.swing .anim-panel {
  transform: rotateY(-100deg);
}

/* Portal glow builds as the door reveals it */
#doorAnim.swing .anim-portal-glow {
  opacity: 1;
}

#doorAnim.swing .anim-portal-glow::after {
  opacity: 1;
}

/* ── "Step through" transition: light expands FROM the portal outward ── */
.anim-step-through {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.anim-step-through-glow {
  width: 280px;
  height: 420px;
  border-radius: 14px 14px 4px 4px;
  background: radial-gradient(ellipse at center,
    rgba(255, 255, 255, 1) 0%,
    rgba(245, 248, 255, 0.95) 30%,
    rgba(230, 240, 255, 0.6) 60%,
    transparent 80%);
  opacity: 0;
  transform: scale(1);
  transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.2, 0, 0, 1);
}

#doorAnim.flash .anim-step-through-glow {
  opacity: 1;
  /* scale up to fill the screen — portal light expanding outward */
  transform: scale(8);
}

/* ── Responsive ── */
@media (max-width: 500px) {
  .door-frame { width: 120px; height: 180px; }
  .door-handle { right: 12px; }
  .search-row input { text-align: center; padding: 0.9rem; }
  .anim-door-frame { width: 200px; height: 300px; }
  .anim-step-through-glow { width: 200px; height: 300px; }
}

/* scrollbar — just in case */
::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<!-- ── Landing page ── -->
<div id="landing">
  <div class="door-wrapper" id="doorClick">
    <div class="door-frame">
      <div class="door-crack-light"></div>
      <div class="door-body">
        <div class="door-handle" id="doorHandle"></div>
      </div>
      <div class="door-crack-spill"></div>
    </div>
    <div class="door-label">
      任意门
      <span class="en">Anywhere Door</span>
    </div>
  </div>

  <div class="search-row">
    <form id="searchForm">
      <input type="text" id="placeInput" placeholder="Where to go?" autocomplete="off" autofocus />

      <button type="submit" class="open-btn" id="openBtn">Open</button>
    </form>
    <p class="hint" id="hintText">Type a place to begin</p>
  </div>
</div>

<!-- ── Door‑open animation ── -->
<div id="doorAnim">
  <div class="anim-scene">
    <div class="anim-door-frame">
      <!-- Portal: sits BEHIND the door panel, inside the frame -->
      <div class="anim-portal">
        <div class="anim-portal-glow"></div>
      </div>
      <!-- God rays emanating from portal -->
      <div class="anim-ray"></div>
      <div class="anim-ray"></div>
      <div class="anim-ray"></div>
      <div class="anim-ray"></div>
      <div class="anim-ray"></div>
      <div class="anim-ray"></div>
      <!-- Light leak around edges -->
      <div class="anim-light-leak"></div>
      <!-- Door panel: swings open to reveal the portal -->
      <div class="anim-panel"></div>
    </div>
  </div>
  <!-- Step-through: light expands FROM the portal opening outward -->
  <div class="anim-step-through">
    <div class="anim-step-through-glow"></div>
  </div>
</div>

<script>
const landing      = document.getElementById('landing');
const searchForm   = document.getElementById('searchForm');
const placeInput   = document.getElementById('placeInput');
const openBtn      = document.getElementById('openBtn');
const doorHandle   = document.getElementById('doorHandle');
const doorAnim     = document.getElementById('doorAnim');
const hintText     = document.getElementById('hintText');
const doorWrapper  = document.getElementById('doorClick');

let isOpening = false;
let lastHasText = false;

const HINT_DEFAULT = 'Type a place to begin';
const HINT_ACTIVE  = 'Press Enter or click Open';

// Show/hide Open button, light leak, and hint text based on input content
placeInput.addEventListener('input', () => {
  const hasText = !!placeInput.value.trim();
  if (hasText) {
    openBtn.classList.add('visible');
    doorWrapper.classList.add('has-text');
  } else {
    openBtn.classList.remove('visible');
    doorWrapper.classList.remove('has-text');
  }

  // Fade-swap hint text when state changes
  if (hasText !== lastHasText) {
    lastHasText = hasText;
    hintText.classList.add('fading');
    setTimeout(() => {
      hintText.textContent = hasText ? HINT_ACTIVE : HINT_DEFAULT;
      hintText.classList.remove('fading');
    }, 300);
  }
});

// Web Audio API — door latch click sound (sharp mechanical)
function playLatchClick(ctx) {
  const duration = 0.05;
  const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    const t = i / ctx.sampleRate;
    // Sharp high-pitched click — latch releasing
    data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 120) * 0.25;
    data[i] += Math.sin(2 * Math.PI * 4500 * t) * Math.exp(-t * 160) * 0.2;
    data[i] += Math.sin(2 * Math.PI * 6000 * t) * Math.exp(-t * 200) * 0.08;
  }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const gain = ctx.createGain();
  gain.gain.value = 0.5;
  src.connect(gain).connect(ctx.destination);
  src.start();
}

// Web Audio API — wooden creak sound using oscillator frequency sweep
function playCreakSound(ctx, delayTime) {
  const startTime = ctx.currentTime + delayTime;
  const creakDuration = 0.9;

  // Main creak — oscillator sweeping up with springy tail
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, startTime);
  osc.frequency.exponentialRampToValueAtTime(600, startTime + creakDuration * 0.6);
  osc.frequency.exponentialRampToValueAtTime(900, startTime + creakDuration);

  // Second harmonic for wooden texture
  const osc2 = ctx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(120, startTime);
  osc2.frequency.exponentialRampToValueAtTime(360, startTime + creakDuration * 0.6);
  osc2.frequency.exponentialRampToValueAtTime(540, startTime + creakDuration);

  // Amplitude modulation for stuttery creak feel
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(12, startTime);
  lfo.frequency.linearRampToValueAtTime(18, startTime + creakDuration);
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 0.4;
  lfo.connect(lfoGain);

  // Envelope — fade in then fade out
  const envelope = ctx.createGain();
  envelope.gain.setValueAtTime(0, startTime);
  envelope.gain.linearRampToValueAtTime(0.08, startTime + 0.15);
  envelope.gain.setValueAtTime(0.08, startTime + creakDuration * 0.6);
  envelope.gain.linearRampToValueAtTime(0, startTime + creakDuration);

  // Modulate the envelope
  lfoGain.connect(envelope.gain);

  // Bandpass filter to shape it like wood
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(300, startTime);
  filter.frequency.exponentialRampToValueAtTime(800, startTime + creakDuration);
  filter.Q.value = 3;

  osc.connect(filter);
  osc2.connect(filter);
  filter.connect(envelope);
  envelope.connect(ctx.destination);

  osc.start(startTime);
  osc2.start(startTime);
  lfo.start(startTime);
  osc.stop(startTime + creakDuration);
  osc2.stop(startTime + creakDuration);
  lfo.stop(startTime + creakDuration);
}

function playDoorSounds() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // 1) Sharp latch click
    playLatchClick(ctx);
    // 2) Wooden creak starts ~200ms after click, as door swings
    playCreakSound(ctx, 0.6);
  } catch (e) { /* audio not available */ }
}

function triggerSearch() {
  if (isOpening) return;
  const place = placeInput.value.trim();
  if (!place) { placeInput.focus(); return; }
  isOpening = true;
  handleTurnThenOpen(place);
}

searchForm.addEventListener('submit', e => { e.preventDefault(); triggerSearch(); });
doorHandle.addEventListener('click', e => { e.stopPropagation(); triggerSearch(); });

async function handleTurnThenOpen(place) {
  // Play door sounds
  playDoorSounds();

  // Brief pause for the click sound
  await wait(200);

  // Now proceed with the door open animation
  openDoor(place);
}

async function openDoor(place) {
  landing.classList.add('hidden');

  doorAnim.classList.add('active');
  doorAnim.classList.remove('entrance', 'swing', 'flash');
  void doorAnim.offsetHeight;

  // Trigger entrance animation — door materializes/approaches
  doorAnim.classList.add('entrance');

  // Wait for the entrance scale+fade transition to complete
  await wait(550);

  // Swing the door open
  doorAnim.classList.add('swing');

  // Let the door swing open and portal glow build up
  await wait(1000);

  // Step-through: portal light expands outward from the opening
  doorAnim.classList.add('flash');

  // Let the step-through light expand to fill the screen
  await wait(600);

  // Open satellite view directly
  const encoded = encodeURIComponent(place);
  window.open(`https://www.google.com/maps/search/${encoded}/@0,0,12z/data=!3m1!4b1`, '_blank');

  // Reset for next use
  await wait(300);
  doorAnim.classList.remove('active', 'entrance', 'swing', 'flash');
  landing.classList.remove('hidden');
  placeInput.value = '';
  openBtn.classList.remove('visible');
  doorWrapper.classList.remove('has-text');
  hintText.textContent = HINT_DEFAULT;
  lastHasText = false;
  placeInput.focus();
  isOpening = false;
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
