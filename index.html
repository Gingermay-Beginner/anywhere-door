<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任意门 / Anywhere Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a12;
  --accent: #e94560;
  --accent2: #ff6b81;
  --gold: #f0c27f;
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --door-pink: #ff4081;
  --door-frame: #c2185b;
  --door-glow: rgba(233, 69, 96, 0.4);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Serif SC', 'Playfair Display', Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

/* ── Stars ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9), transparent),
    radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.8), transparent);
  background-size: 200px 200px;
  animation: twinkle 8s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

@keyframes twinkle {
  0% { opacity: 0.3; }
  50% { opacity: 0.6; }
  100% { opacity: 0.4; }
}

/* ══════════════════════════════════════
   LANDING PAGE
   ══════════════════════════════════════ */
#landing {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}

#landing.hidden {
  opacity: 0;
  pointer-events: none;
}

#landing.returning {
  opacity: 0;
  transition: opacity 0.6s ease;
}

#landing.returning.fade-in {
  opacity: 1;
}

/* ── Door illustration ── */
.door-wrapper {
  position: relative;
  cursor: pointer;
  margin-bottom: 2.5rem;
  perspective: 800px;
  /* clicking the door = submitting the search */
}

.door-frame {
  width: 160px;
  height: 240px;
  background: var(--door-frame);
  border-radius: 20px 20px 6px 6px;
  padding: 8px 8px 6px;
  box-shadow:
    0 0 60px var(--door-glow),
    0 0 120px rgba(233, 69, 96, 0.15);
  animation: doorFloat 4s ease-in-out infinite;
  position: relative;
  transform-style: preserve-3d;
}

.door-body {
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, var(--door-pink), #e91e63);
  border-radius: 14px 14px 3px 3px;
  position: relative;
  overflow: hidden;
  transform-origin: left center;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
}

/* Portal light behind the door — revealed when door cracks open */
.door-crack-light {
  position: absolute;
  inset: 8px 8px 6px 8px;
  border-radius: 14px 14px 3px 3px;
  background: radial-gradient(ellipse at 80% 50%,
    rgba(220, 235, 255, 1) 0%,
    rgba(200, 220, 255, 0.8) 30%,
    rgba(180, 210, 255, 0.5) 60%,
    rgba(160, 200, 255, 0.2) 100%);
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 0;
}

.door-wrapper.has-text .door-crack-light {
  opacity: 0;
}

/* When input has text, door panel vibrates like someone knocking from inside */
.door-wrapper.has-text .door-body {
  animation: doorKnock 2.4s ease-in-out infinite;
}

@keyframes doorKnock {
  0% { transform: translateX(0); }
  /* Quick knock sequence: 0.4s total (0% - ~17% of 2.4s) */
  3% { transform: translateX(3px); }
  6% { transform: translateX(-2px); }
  10% { transform: translateX(2px); }
  14% { transform: translateX(-1px); }
  17% { transform: translateX(0); }
  /* Pause for remainder */
  100% { transform: translateX(0); }
}

/* Right-side light spill from the crack (opening edge = widest gap) */
.door-crack-spill {
  position: absolute;
  top: 8px;
  right: 0px;
  bottom: 6px;
  width: 20px;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse at 100% 50%,
    rgba(210, 225, 255, 0.7) 0%,
    rgba(200, 220, 255, 0.3) 40%,
    transparent 80%);
  filter: blur(4px);
}

/* Top-right corner glow — soft radial fade, no hard edges */
.door-crack-spill::before {
  content: '';
  position: absolute;
  top: -20px;
  right: -8px;
  width: 60px;
  height: 40px;
  background: radial-gradient(ellipse at 100% 100%,
    rgba(210, 225, 255, 0.5) 0%,
    rgba(200, 220, 255, 0.2) 40%,
    transparent 70%);
  filter: blur(6px);
}

/* Bottom-right corner glow — soft radial fade, no hard edges */
.door-crack-spill::after {
  content: '';
  position: absolute;
  bottom: -18px;
  right: -8px;
  width: 60px;
  height: 36px;
  background: radial-gradient(ellipse at 100% 0%,
    rgba(210, 225, 255, 0.4) 0%,
    rgba(200, 220, 255, 0.15) 40%,
    transparent 70%);
  filter: blur(6px);
}

.door-wrapper.has-text .door-crack-spill {
  opacity: 0;
}

/* No extra glow when has text — just keep the default frame shadow */

/* inner panel lines */
.door-body::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 10px 10px 2px 2px;
}

/* door handle — round brass knob */
.door-handle {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6d5, #f0c27f 40%, #c9953c 75%, #8b6914);
  box-shadow:
    0 0 8px rgba(240, 194, 127, 0.5),
    0 2px 4px rgba(0,0,0,0.4),
    inset 0 1px 2px rgba(255,255,255,0.4);
  z-index: 5;
  cursor: pointer;
  transition: filter 0.2s;
}

.door-handle:hover { filter: brightness(1.15); }
.door-handle:active { filter: brightness(0.95); }

/* subtle light beam from under the door */
.door-frame::after {
  content: '';
  position: absolute;
  bottom: -30px;
  left: 10%;
  width: 80%;
  height: 30px;
  background: radial-gradient(ellipse at center top, rgba(255,255,255,0.08), transparent 80%);
}


@keyframes doorFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.door-label {
  text-align: center;
  margin-top: 1.2rem;
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.3;
  pointer-events: none;
}

.door-label .en {
  display: block;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 0.45em;
  font-weight: 400;
  font-style: italic;
  opacity: 0.8;
  margin-top: 0.15em;
  background: linear-gradient(135deg, var(--gold), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Search input ── */
.search-row {
  width: 60%;
  max-width: 340px;
  margin: 0 auto;
}

.search-row form {
  display: flex;
  align-items: center;
  background: rgba(18, 18, 31, 0.85);
  border-radius: 60px;
  border: 2px solid rgba(233, 69, 96, 0.25);
  overflow: visible;
  transition: border-color 0.3s, box-shadow 0.3s;
  backdrop-filter: blur(12px);
  padding-right: 0.55rem;
}

.search-row form:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 40px var(--door-glow);
}

.search-row input {
  flex: 1;
  padding: 1rem 1.5rem;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  outline: none;
}

.search-row input::placeholder { color: rgba(255,255,255,0.35); }

.search-row input {
  border-radius: 60px;
}

/* Fake placeholder with marquee */
.search-row form {
  position: relative;
}
.placeholder-marquee {
  position: absolute;
  left: 1.5rem;
  right: 3.5rem;
  top: 50%;
  transform: translateY(-50%);
  overflow: hidden;
  pointer-events: none;
  height: 1.2em;
  line-height: 1.2em;
}
.placeholder-marquee span {
  display: inline-block;
  white-space: nowrap;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 16px;
  padding-left: 0%;
  /* No animation by default — text is clipped/truncated */
}
.placeholder-marquee span.scrolling {
  animation: marquee-scroll 5s linear infinite;
  animation-delay: 0.4s;
}
@keyframes marquee-scroll {
  0%   { transform: translateX(0); }
  15%  { transform: translateX(0); }
  85%  { transform: translateX(var(--marquee-offset, -40%)); }
  100% { transform: translateX(var(--marquee-offset, -40%)); }
}

/* Open button inside input */
.open-btn {
  flex-shrink: 0;
  padding: 0.55rem 1.4rem;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #D4AF5A, #C9A84C, #B8943F);
  color: #fff;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  opacity: 0;
  max-width: 0;
  overflow: hidden;
  transition: opacity 0.3s ease, max-width 0.3s ease, padding 0.3s ease, box-shadow 0.2s ease;
  padding: 0;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(201, 168, 76, 0.3);
}

.open-btn.visible {
  opacity: 1;
  max-width: 100px;
  padding: 0.55rem 1.4rem;
}

.open-btn:hover {
  box-shadow: 0 4px 16px rgba(201, 168, 76, 0.5);
}

.open-btn:active {
  filter: brightness(0.92);
}

.hint {
  text-align: center;
  margin-top: 0.8rem;
  color: var(--text-dim);
  font-size: 0.8rem;
  font-style: italic;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.hint.fading { opacity: 0; }

/* ══════════════════════════════════════
   DOOR‑OPEN ANIMATION OVERLAY
   ══════════════════════════════════════ */
#doorAnim {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: var(--bg);
}

#doorAnim.active { display: block; }

/* the visible door centred on screen that will swing open */
.anim-scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1200px;
}

.anim-door-frame {
  width: 280px;
  height: 420px;
  position: relative;
  transform-style: preserve-3d;
  overflow: visible;
  opacity: 0;
  transform: scale(0.3);
  transition: opacity 0.5s ease-out, transform 0.5s ease-out;
}

#doorAnim.entrance .anim-door-frame {
  opacity: 1;
  transform: scale(1);
}

/* door frame border — FRONT layer, always on top */
.anim-door-frame::before {
  content: '';
  position: absolute;
  inset: -10px;
  border: 10px solid var(--door-frame);
  border-radius: 22px 22px 8px 8px;
  pointer-events: none;
  z-index: 3;
  transition: border-color 0.8s ease, box-shadow 0.8s ease;
}

/* Frame glows white/blue-white when door is open */
#doorAnim.swing .anim-door-frame::before {
  border-color: rgba(220, 235, 255, 0.9);
  box-shadow:
    0 0 15px rgba(220, 235, 255, 0.8),
    0 0 40px rgba(200, 220, 255, 0.5),
    0 0 80px rgba(180, 210, 255, 0.3),
    inset 0 0 15px rgba(255, 255, 255, 0.6);
}

/* ── Portal opening: sits INSIDE/BEHIND the door frame ── */
.anim-portal {
  position: absolute;
  inset: -2px;
  border-radius: 14px 14px 4px 4px;
  overflow: visible;
  z-index: 0;
  background: #fff;
}

/* pure white light filling the entire portal opening */
.anim-portal-glow {
  position: absolute;
  inset: -8px;
  background: #fff;
  opacity: 0;
  transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow:
    0 0 40px 20px rgba(255, 255, 255, 0.9),
    0 0 80px 40px rgba(220, 235, 255, 0.6),
    0 0 150px 60px rgba(200, 220, 255, 0.3);
}

/* very subtle cool shimmer layer */
.anim-portal-glow::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(220, 235, 255, 0.3) 0%,
    rgba(255, 255, 255, 0) 30%,
    rgba(255, 255, 255, 0) 70%,
    rgba(220, 235, 255, 0.2) 100%);
  animation: portalPulse 3s ease-in-out infinite alternate;
  opacity: 0;
  transition: opacity 1.2s ease 0.3s;
}

@keyframes portalPulse {
  0% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* light leak around the door edges — visible before door fully opens */
.anim-light-leak {
  position: absolute;
  inset: -6px;
  border-radius: 18px 18px 6px 6px;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.6s ease;
  box-shadow:
    inset 0 0 30px rgba(255, 255, 255, 0.9),
    0 0 30px rgba(255, 255, 255, 0.8),
    0 0 60px rgba(230, 240, 255, 0.6),
    0 0 120px rgba(220, 235, 255, 0.3);
  pointer-events: none;
}

/* ── God rays emanating from the portal ── */
.anim-ray {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 4px;
  height: 500px;
  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.25) 20%,
    rgba(230, 240, 255, 0.15) 50%,
    rgba(220, 235, 255, 0.05) 80%,
    transparent 100%
  );
  transform-origin: top center;
  opacity: 0;
  z-index: 1;
  pointer-events: none;
  filter: blur(3px);
  transition: opacity 0.8s ease 0.3s;
}

.anim-ray:nth-child(1) { transform: translate(-50%, 0) rotate(-50deg); width: 5px; height: 450px; }
.anim-ray:nth-child(2) { transform: translate(-50%, 0) rotate(-25deg); width: 3px; height: 550px; }
.anim-ray:nth-child(3) { transform: translate(-50%, 0) rotate(5deg); width: 6px; height: 500px; }
.anim-ray:nth-child(4) { transform: translate(-50%, 0) rotate(35deg); width: 4px; height: 480px; }
.anim-ray:nth-child(5) { transform: translate(-50%, 0) rotate(60deg); width: 3px; height: 520px; }
.anim-ray:nth-child(6) { transform: translate(-50%, 0) rotate(-70deg); width: 5px; height: 460px; }

#doorAnim.swing .anim-ray {
  opacity: 1;
  animation: rayPulse 2s ease-in-out infinite alternate;
}

.anim-ray:nth-child(2) { animation-delay: 0.3s; }
.anim-ray:nth-child(3) { animation-delay: 0.6s; }
.anim-ray:nth-child(4) { animation-delay: 0.15s; }
.anim-ray:nth-child(5) { animation-delay: 0.45s; }
.anim-ray:nth-child(6) { animation-delay: 0.75s; }

@keyframes rayPulse {
  0% { opacity: 0.5; }
  100% { opacity: 1; }
}

/* single door panel — hinges on the left, ABOVE the portal */
.anim-panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, var(--door-pink), #c2185b);
  backface-visibility: hidden;
  transition: transform 1.1s cubic-bezier(0.16, 0.9, 0.4, 1);
  box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  border-radius: 14px 14px 4px 4px;
  transform-origin: left center;
  transform: rotateY(0deg);
  z-index: 2;
}

/* inner panel line */
.anim-panel::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 10px 10px 2px 2px;
}

/* round knob on the animation panel */
.anim-panel::after {
  content: '';
  position: absolute;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6d5, #f0c27f 40%, #c9953c 75%, #8b6914);
  box-shadow: 0 0 8px rgba(240, 194, 127, 0.5), 0 2px 4px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.4);
}

/* ── Opening states ── */

/* Light leaks start early — as soon as door begins to move */
#doorAnim.swing .anim-light-leak {
  opacity: 1;
}

/* Door swings open revealing the portal */
#doorAnim.swing .anim-panel {
  transform: rotateY(-100deg);
}

/* Portal glow builds as the door reveals it */
#doorAnim.swing .anim-portal-glow {
  opacity: 1;
}

#doorAnim.swing .anim-portal-glow::after {
  opacity: 1;
}

/* ── "Step through" transition: light expands FROM the portal outward ── */
.anim-step-through {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.anim-step-through-glow {
  width: 280px;
  height: 420px;
  border-radius: 14px 14px 4px 4px;
  background: radial-gradient(ellipse at center,
    rgba(255, 255, 255, 1) 0%,
    rgba(245, 248, 255, 0.95) 30%,
    rgba(230, 240, 255, 0.6) 60%,
    transparent 80%);
  opacity: 0;
  transform: scale(1);
  transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.2, 0, 0, 1);
}

#doorAnim.flash .anim-step-through-glow {
  opacity: 1;
  /* scale up to fill the screen — portal light expanding outward */
  transform: scale(8);
}

/* ── Responsive ── */
@media (max-width: 500px) {
  .door-frame { width: 120px; height: 180px; }
  .door-handle { right: 12px; }
  .search-row { max-width: min(340px, 90vw); width: min(340px, 90vw); }
  .search-row form { width: 100%; }
  .search-row input { text-align: left; padding: 0.9rem 1rem; font-size: 16px; width: 100%; }
  .anim-door-frame { width: 200px; height: 300px; }
  .anim-step-through-glow { width: 200px; height: 300px; }
}

/* ══════════════════════════════════════
   EASTER EGG ANIMATIONS
   ══════════════════════════════════════ */

/* ── Container for all easter egg overlays ── */
.easter-egg-overlay {
  position: fixed;
  inset: 0;
  z-index: 150;
  pointer-events: none;
  overflow: hidden;
}

/* ── Tokyo: Cherry Blossom Petals ── */
.petal {
  position: absolute;
  top: -30px;
  width: 12px;
  height: 12px;
  background: radial-gradient(ellipse at 30% 30%, #ffb7d5, #ff69b4 60%, #ff1493);
  border-radius: 50% 0 50% 50%;
  opacity: 0;
  animation: petalFall 2s ease-in forwards;
}

@keyframes petalFall {
  0% { opacity: 0; transform: translateY(0) rotate(0deg) translateX(0); }
  10% { opacity: 0.9; }
  100% { opacity: 0; transform: translateY(105vh) rotate(720deg) translateX(60px); }
}

/* ── Hawaii: Volcanic Glow ── */
.volcanic-glow {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  animation: volcGlow 1.5s ease-in-out forwards;
  box-shadow:
    inset 0 0 120px rgba(255, 80, 0, 0.6),
    inset 0 0 250px rgba(255, 40, 0, 0.3);
}

@keyframes volcGlow {
  0% { opacity: 0; }
  30% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; }
}

.ember {
  position: absolute;
  bottom: 0;
  width: 4px;
  height: 4px;
  background: radial-gradient(circle, #ffcc00, #ff6600);
  border-radius: 50%;
  opacity: 0;
  animation: emberRise 1.5s ease-out forwards;
}

@keyframes emberRise {
  0% { opacity: 0; transform: translateY(0) scale(1); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-100vh) scale(0.3); }
}

/* ── Arctic: Aurora Borealis ── */
.aurora-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  z-index: 50;
  pointer-events: none;
  overflow: hidden;
  opacity: 0;
  animation: auroraFade 2s ease-in-out forwards;
}

@keyframes auroraFade {
  0% { opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

.aurora-wave {
  position: absolute;
  left: -10%;
  width: 120%;
  height: 120px;
  border-radius: 50%;
  filter: blur(30px);
  opacity: 0.7;
  animation: auroraRipple 2s ease-in-out infinite;
}

.aurora-wave:nth-child(1) {
  top: 5%;
  background: linear-gradient(90deg, transparent, rgba(0,255,180,0.4), rgba(0,200,255,0.3), transparent);
  animation-duration: 2.5s;
}

.aurora-wave:nth-child(2) {
  top: 15%;

.aurora-wave:nth-child(3) {

@keyframes auroraRipple {

  50% { transform: translateX(5%) scaleY(1.4); }
  100% { transform: translateX(-5%) scaleY(1); }
}

/* ── Hearts: JS-driven animation, no CSS keyframes ── */

/* ── Mobile keyboard open state ── */
#landing.keyboard-open .door-wrapper {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#landing.keyboard-open .search-row {
  transform: translateY(-20px);
  transition: transform 0.3s ease;
}

/* ══════════════════════════════════════
   STREET VIEW FULLSCREEN
   ══════════════════════════════════════ */
#streetview {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  background: #000;
}

#streetview.active {
  display: block;
}

#streetview-pano {
  width: 100%;
  height: 100%;
}

#streetview-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
  color: var(--text);
  font-size: 1.1rem;
  z-index: 201;
  background: #000;
}

#streetview-loading .spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.sv-fallback {
  text-align: center;
}

.sv-fallback a {
  display: inline-block;
  margin-top: 1rem;
  padding: 0.6rem 1.6rem;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  transition: opacity 0.2s;
}

.sv-fallback a:hover {
  opacity: 0.85;
}

/* ── Return Door Button (on Street View) ── */
.return-door-btn {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 220;
  display: none;
  align-items: center;
  gap: 0.4rem;
  padding: 0.6rem 1.4rem;
  border: none;
  border-radius: 50px;
  background: rgba(20, 20, 35, 0.75);
  color: #fff;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(10px);
  box-shadow:
    0 0 20px rgba(233, 69, 96, 0.3),
    0 2px 12px rgba(0, 0, 0, 0.4);
  transition: transform 0.4s ease-out, bottom 0.4s ease-out, box-shadow 0.4s ease-out, background 0.4s ease-out, padding 0.4s ease-out;
}

.return-door-btn .mini-door {
  display: inline-block;
  width: 16px;
  height: 22px;
  background: #111; /* dark interior */
  border-radius: 4px 4px 1px 1px;
  position: relative;
  box-shadow: 0 0 10px rgba(233, 69, 96, 0.6);
  perspective: 120px;
  transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
}

/* Door panel that swings open/closed, hinged on left */
.return-door-btn .mini-door-panel {
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, var(--door-pink), #e91e63);
  border-radius: 4px 4px 1px 1px;
  transform-origin: left center;
  animation: doorPeek 4.3s ease-in-out infinite;
  z-index: 2;
}

@keyframes doorPeek {
  0%        { transform: rotateY(0deg); }
  18.6%     { transform: rotateY(-40deg); }
  27.9%     { transform: rotateY(-40deg); }
  41.9%     { transform: rotateY(0deg); }
  100%      { transform: rotateY(0deg); }
}

@keyframes doorSpring {
  0%        { transform: rotateY(0deg); }
  12%       { transform: rotateY(-50deg); }
  20%       { transform: rotateY(-15deg); }
  28%       { transform: rotateY(-40deg); }
  36%       { transform: rotateY(-20deg); }
  44%       { transform: rotateY(-35deg); }
  52%       { transform: rotateY(-25deg); }
  60%       { transform: rotateY(-30deg); }
  66%       { transform: rotateY(-28deg); }
  72%       { transform: rotateY(-30deg); }
  88%       { transform: rotateY(0deg); }
  100%      { transform: rotateY(0deg); }
}

.return-door-btn .mini-knob {
  position: absolute;
  right: 3px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6d5, #f0c27f 60%, #c9953c);
  z-index: 10;
  pointer-events: none;
}

.return-door-btn .return-label {
  transition: opacity 0.4s ease-out, width 0.4s ease-out, margin 0.4s ease-out;
  overflow: hidden;
  white-space: nowrap;
  display: inline-block;
}

/* Hover state */
.return-door-btn:hover {
  transform: translateX(-50%) scale(2.2);
  bottom: 60px;
  background: transparent;
  backdrop-filter: none;
  border: none;
  padding: 0.6rem;
  box-shadow: none;
}

.return-door-btn:hover .return-label {
  opacity: 0;
  width: 0;
  margin: 0;
}

.return-door-btn:hover .mini-door {
  box-shadow: 0 0 24px rgba(233, 69, 96, 1), 0 0 50px rgba(233, 69, 96, 0.7);
  transform: scale(1.5);
}

/* On hover, spring bounce animation */
.return-door-btn:hover .mini-door-panel {
  animation: doorSpring 2.5s ease-in-out infinite;
}

.return-door-btn:active {
  transform: translateX(-50%) scale(2.0);
  bottom: 58px;
}

#streetview.active .return-door-btn {
  display: flex;
}

/* ── Full-Screen Door Close Overlay ── */
#doorCloseAnim {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  pointer-events: none;
}

#doorCloseAnim.active {
  display: block;
  pointer-events: all;
}

.close-scene {
  position: absolute;
  inset: 0;
  perspective: 1800px;
  overflow: hidden;
}

/* Full-screen door frame border on all 4 edges */
.close-door-frame {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  overflow: hidden;
}

.close-door-frame::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 12px solid rgba(220, 235, 255, 0.9);
  pointer-events: none;
  z-index: 3;
  box-shadow:
    0 0 15px rgba(220, 235, 255, 0.8),
    0 0 40px rgba(200, 220, 255, 0.5),
    inset 0 0 15px rgba(255, 255, 255, 0.3);
  transition: border-color 0.8s ease, box-shadow 0.8s ease;
}

#doorCloseAnim.closing .close-door-frame::before {
  border-color: var(--door-frame);
  box-shadow:
    0 0 60px var(--door-glow),
    inset 0 0 30px rgba(233, 69, 96, 0.15);
}

/* The "portal" behind the door — shows through when door is open */
.close-portal {
  position: absolute;
  inset: 12px;
  background: transparent;
  z-index: 0;
}

/* Crack of light on the right edge — narrows as door closes */
.close-light-crack {
  position: absolute;
  top: 12px;
  right: 12px;
  bottom: 12px;
  width: 100%;
  background: linear-gradient(to left,
    rgba(255, 255, 255, 0.95) 0%,
    rgba(230, 240, 255, 0.6) 15%,
    rgba(200, 220, 255, 0.2) 40%,
    transparent 70%);
  z-index: 1;
  opacity: 1;
  transition: opacity 0.8s ease 0.6s;
}

#doorCloseAnim.closing .close-light-crack {
  opacity: 0;
}

/* Full-screen door panel — swings closed from left edge */
.close-panel {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  bottom: 12px;
  background: linear-gradient(160deg, var(--door-pink), #c2185b);
  backface-visibility: hidden;
  transform-origin: left center;
  transform: rotateY(-90deg);
  z-index: 2;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.25);
  transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* inner panel lines */
.close-panel::before {
  content: '';
  position: absolute;
  inset: 24px;
  border: 2px solid rgba(255,255,255,0.12);
  pointer-events: none;
}

/* door handle */
.close-panel::after {
  content: '';
  position: absolute;
  right: 48px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6d5, #f0c27f 40%, #c9953c 75%, #8b6914);
  box-shadow: 0 0 12px rgba(240, 194, 127, 0.5), 0 2px 6px rgba(0,0,0,0.4);
}

#doorCloseAnim.closing .close-panel {
  transform: rotateY(0deg);
}

/* fade-to-dark overlay after door fully closes */
.close-fade {
  position: absolute;
  inset: 0;
  background: var(--bg);
  opacity: 0;
  z-index: 5;
  transition: opacity 0.5s ease;
}

#doorCloseAnim.closed .close-fade {
  opacity: 1;
}

/* Phase 3: shrink from fullscreen to small door size, centered */
#doorCloseAnim.shrinking {
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease 0.6s;
  transform-origin: center center;
  transform: scale(0.08);
  border-radius: 20px;
  opacity: 0;
}

/* Hide the dark frame/scene when shrinking — only keep the pink panel visible */
#doorCloseAnim.shrinking .close-scene,
#doorCloseAnim.shrinking .close-door-frame,
#doorCloseAnim.shrinking .close-light-crack,
#doorCloseAnim.shrinking .close-fade {
  display: none;
}

#doorCloseAnim.shrinking .close-panel {
  position: fixed;
  inset: 0;
  transform: rotateY(0deg);
  border-radius: 20px;
  background: linear-gradient(160deg, var(--door-pink), #c2185b);
  z-index: 9999;
  transition: none;
}

@media (max-width: 500px) {
  .return-door-btn { bottom: 24px; font-size: 0.85rem; padding: 0.5rem 1.1rem; }
}

/* ── Shooting stars ── */
.shooting-star {
  position: fixed;
  pointer-events: none;
  z-index: 1;
  width: var(--len, 80px);
  height: 1.5px;
  background: linear-gradient(90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.03) 25%,
    rgba(255,255,255,0.1) 55%,
    rgba(255,255,255,0.35) 80%,
    rgba(255,255,255,0.7) 100%
  );
  clip-path: polygon(0% 50%, 100% 20%, 100% 80%);
  opacity: 0;
  animation: shootingStar var(--duration) linear forwards;
}

.shooting-star.bright {
  height: 2px;
  filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
}

@keyframes shootingStar {
  0%   { opacity: 0;   transform: translate(0, 0) rotate(var(--rot)); }
  8%   { opacity: var(--peak, 0.55); }
  60%  { opacity: calc(var(--peak, 0.55) * 0.6); }
  100% { opacity: 0;   transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
}

/* scrollbar — just in case */
::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>

<!-- ── Landing page ── -->
<div id="landing">
  <div class="door-wrapper" id="doorClick">
    <div class="door-frame">
      <div class="door-crack-light"></div>

      <!-- Portal: sits BEHIND the door panel, inside the frame -->

<script>
const GMAPS_API_KEY = 'AIzaSyD1Y6cgwKJBLTMP5729GYcbiPvZpZPR1Lo';

const landing      = document.getElementById('landing');
const searchForm   = document.getElementById('searchForm');
const placeInput   = document.getElementById('placeInput');
const openBtn      = document.getElementById('openBtn');
const doorHandle   = document.getElementById('doorHandle');
const doorAnim     = document.getElementById('doorAnim');
const hintText     = document.getElementById('hintText');
const doorWrapper  = document.getElementById('doorClick');
const streetview   = document.getElementById('streetview');
const svLoading    = document.getElementById('streetview-loading');
const svPano       = document.getElementById('streetview-pano');
const marqueeEl    = document.getElementById('placeholderMarquee');
const marqueeSpan  = marqueeEl.querySelector('span');

let isOpening = false;
let gmapsLoaded = false;
let gmapsLoadPromise = null;
let lastHasText = false;

const PLACEHOLDERS = [
  'Where your heart wants to go',
  'The place you keep thinking about',
  'Where would you run to?'
];
let currentPlaceholder = -1;

function setMarqueeText(text) {
  marqueeSpan.textContent = text;
  marqueeSpan.classList.remove('scrolling');
  // Calculate how far to scroll based on overflow
  const containerW = marqueeEl.offsetWidth;
  const textW = marqueeSpan.scrollWidth;
  if (textW > containerW) {
    const offset = -(textW - containerW);
    marqueeSpan.style.setProperty('--marquee-offset', offset + 'px');
  } else {
    marqueeSpan.style.setProperty('--marquee-offset', '0px');
  }
}

function showMarquee(show) {
  marqueeEl.style.display = show ? '' : 'none';
}

function pickPlaceholder() {
  let next;
  do { next = Math.floor(Math.random() * PLACEHOLDERS.length); }
  while (next === currentPlaceholder && PLACEHOLDERS.length > 1);
  currentPlaceholder = next;
  setMarqueeText(PLACEHOLDERS[next]);
}

// Set initial placeholder
currentPlaceholder = Math.floor(Math.random() * PLACEHOLDERS.length);
setMarqueeText(PLACEHOLDERS[currentPlaceholder]);

// Hide marquee on focus, show on blur if empty
placeInput.addEventListener('focus', () => showMarquee(false));
placeInput.addEventListener('blur', () => {
  if (!placeInput.value.trim()) showMarquee(true);
});

// Hover over input area: start marquee scroll; leave: stop/reset
searchForm.addEventListener('mouseenter', () => {
  if (marqueeEl.style.display !== 'none') {
    marqueeSpan.classList.add('scrolling');
  }
});
searchForm.addEventListener('mouseleave', () => {
  if (document.activeElement !== placeInput) {
    marqueeSpan.classList.remove('scrolling');
  }
});

const HINT_PHRASES = [
  'Where your heart wants to go',
  'The place you keep thinking about',
  'Where would you run to?'
];
let currentHintIndex = Math.floor(Math.random() * HINT_PHRASES.length);
hintText.textContent = HINT_PHRASES[currentHintIndex];

function pickHint() {
  let next;
  do { next = Math.floor(Math.random() * HINT_PHRASES.length); }
  while (next === currentHintIndex && HINT_PHRASES.length > 1);
  currentHintIndex = next;
  hintText.textContent = HINT_PHRASES[currentHintIndex];
}

const HINT_DEFAULT = null; // now handled by pickHint()
const HINT_ACTIVE  = 'Press Enter or click Open';

// Show/hide Open button, light leak, and hint text based on input content
function handleInputChange() {
  const hasText = !!placeInput.value.trim();
  if (hasText) {
    openBtn.classList.add('visible');
    doorWrapper.classList.add('has-text');
    showMarquee(false);
  } else {
    openBtn.classList.remove('visible');
    doorWrapper.classList.remove('has-text');
    if (lastHasText) pickPlaceholder();
    if (document.activeElement !== placeInput) showMarquee(true);
  }

  // Fade-swap hint text when state changes
  if (hasText !== lastHasText) {
    lastHasText = hasText;
    hintText.classList.add('fading');
    setTimeout(() => {
      if (hasText) { hintText.textContent = HINT_ACTIVE; } else { pickHint(); }
      hintText.classList.remove('fading');
    }, 300);
  }
}

// Both 'input' and 'keyup' to ensure mobile keyboard input is detected
placeInput.addEventListener('input', handleInputChange);
placeInput.addEventListener('keyup', handleInputChange);

// Web Audio API — magical portal door sound
function playDoorSounds() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    // Create reverb impulse response
    function makeReverb(duration, decay) {
      const len = ctx.sampleRate * duration;
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    // Shared reverb
    const convolver = ctx.createConvolver();
    convolver.buffer = makeReverb(1.5, 3);
    const reverbGain = ctx.createGain();
    reverbGain.gain.value = 0.2;
    convolver.connect(reverbGain).connect(ctx.destination);

    // 1) Soft low latch click — ~300Hz, 80ms
    const clickOsc = ctx.createOscillator();
    clickOsc.type = 'sine';
    clickOsc.frequency.setValueAtTime(300, now);
    clickOsc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
    const clickEnv = ctx.createGain();
    clickEnv.gain.setValueAtTime(0, now);
    clickEnv.gain.linearRampToValueAtTime(0.2, now + 0.003);
    clickEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    // Soft noise layer for texture
    const clickNoiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
    const clickNoiseData = clickNoiseBuf.getChannelData(0);
    for (let i = 0; i < clickNoiseData.length; i++) {
      const t = i / ctx.sampleRate;
      clickNoiseData[i] = (Math.random() * 2 - 1) * Math.exp(-t * 100) * 0.12;
    }
    const clickNoise = ctx.createBufferSource();
    clickNoise.buffer = clickNoiseBuf;
    const clickFilter = ctx.createBiquadFilter();
    clickFilter.type = 'bandpass';
    clickFilter.frequency.value = 300;
    clickFilter.Q.value = 2;
    clickOsc.connect(clickFilter);
    clickNoise.connect(clickFilter);
    clickFilter.connect(clickEnv);
    clickEnv.connect(ctx.destination);
    clickEnv.connect(convolver);
    clickOsc.start(now);
    clickOsc.stop(now + 0.08);
    clickNoise.start(now);
    clickNoise.stop(now + 0.04);

    // 2) Smooth wooden creak — sweeps upward with reverb, starts after click
    const creakStart = now + 0.15;
    const creakDur = 1.2;
    const creakOsc = ctx.createOscillator();
    creakOsc.type = 'sawtooth';
    creakOsc.frequency.setValueAtTime(140, creakStart);
    creakOsc.frequency.exponentialRampToValueAtTime(400, creakStart + creakDur * 0.5);
    creakOsc.frequency.exponentialRampToValueAtTime(600, creakStart + creakDur);
    const creakOsc2 = ctx.createOscillator();
    creakOsc2.type = 'triangle';
    creakOsc2.frequency.setValueAtTime(90, creakStart);
    creakOsc2.frequency.exponentialRampToValueAtTime(260, creakStart + creakDur * 0.5);
    creakOsc2.frequency.exponentialRampToValueAtTime(380, creakStart + creakDur);
    // Gentle LFO for organic movement (not stuttery)
    const creakLfo = ctx.createOscillator();
    creakLfo.type = 'sine';
    creakLfo.frequency.value = 5;
    const creakLfoGain = ctx.createGain();
    creakLfoGain.gain.value = 0.15;
    creakLfo.connect(creakLfoGain);
    const creakEnv = ctx.createGain();
    creakEnv.gain.setValueAtTime(0, creakStart);
    creakEnv.gain.linearRampToValueAtTime(0.06, creakStart + 0.2);
    creakEnv.gain.setValueAtTime(0.06, creakStart + creakDur * 0.5);
    creakEnv.gain.linearRampToValueAtTime(0, creakStart + creakDur);
    creakLfoGain.connect(creakEnv.gain);
    const creakFilter = ctx.createBiquadFilter();
    creakFilter.type = 'bandpass';
    creakFilter.frequency.setValueAtTime(200, creakStart);
    creakFilter.frequency.exponentialRampToValueAtTime(550, creakStart + creakDur);
    creakFilter.Q.value = 2;
    creakOsc.connect(creakFilter);
    creakOsc2.connect(creakFilter);
    creakFilter.connect(creakEnv);
    creakEnv.connect(ctx.destination);
    creakEnv.connect(convolver);
    creakOsc.start(creakStart);
    creakOsc2.start(creakStart);
    creakLfo.start(creakStart);
    creakOsc.stop(creakStart + creakDur);
    creakOsc2.stop(creakStart + creakDur);
    creakLfo.stop(creakStart + creakDur);

    // 3) Subtle whoosh — white noise burst as door opens
    const whooshStart = now + 0.3;
    const whooshDur = 0.5;
    const whooshBuf = ctx.createBuffer(1, ctx.sampleRate * whooshDur, ctx.sampleRate);
    const whooshData = whooshBuf.getChannelData(0);
    for (let i = 0; i < whooshData.length; i++) {
      const t = i / ctx.sampleRate;
      const env = Math.sin(Math.PI * t / whooshDur); // bell curve
      whooshData[i] = (Math.random() * 2 - 1) * env;
    }
    const whooshSrc = ctx.createBufferSource();
    whooshSrc.buffer = whooshBuf;
    const whooshFilter = ctx.createBiquadFilter();
    whooshFilter.type = 'highpass';
    whooshFilter.frequency.value = 800;
    const whooshGain = ctx.createGain();
    whooshGain.gain.value = 0.07;
    whooshSrc.connect(whooshFilter);
    whooshFilter.connect(whooshGain);
    whooshGain.connect(ctx.destination);
    whooshGain.connect(convolver);
    whooshSrc.start(whooshStart);
    whooshSrc.stop(whooshStart + whooshDur);

  } catch (e) { /* audio not available */ }
}

function triggerSearch() {
  if (isOpening) return;
  const place = placeInput.value.trim();
  if (!place) { placeInput.focus(); return; }
  isOpening = true;
  handleTurnThenOpen(place);
}

searchForm.addEventListener('submit', e => { e.preventDefault(); triggerSearch(); });
doorHandle.addEventListener('click', e => { e.stopPropagation(); triggerSearch(); });
doorWrapper.addEventListener('click', () => { triggerSearch(); });

// ── Easter egg detection ──
function detectEasterEgg(place) {
  const lower = place.toLowerCase();
  if (lower.includes('tokyo') || lower.includes('东京') || lower.includes('とうきょう')) return 'tokyo';
  if (lower.includes('arctic') || lower.includes('北极') || lower.includes('north pole')) return 'arctic';
  // Hearts locations
  const heartKeywords = [
    '红木城', 'redwood city',
    '半月湾', 'half moon bay',
    '巨杉国家公园', 'sequoia national park', 'sequoia',
    '夏威夷', 'hawaii',
    '夏威夷火山国家公园', 'hawaii volcanoes', 'volcanoes national park',
    '夏威夷大岛', 'big island', '北京', 'beijing',
  ];
  if (heartKeywords.some(kw => lower.includes(kw))) return 'hearts';
  return null;
}

function playTokyoAnimation() {
  const overlay = document.createElement('div');
  overlay.className = 'easter-egg-overlay';
  for (let i = 0; i < 20; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = (Math.random() * 100) + '%';
    petal.style.animationDelay = (Math.random() * 0.8) + 's';
    petal.style.animationDuration = (1.4 + Math.random() * 0.8) + 's';
    const size = 8 + Math.random() * 10;
    petal.style.width = size + 'px';
    petal.style.height = size + 'px';
    const hue = Math.random() > 0.5 ? '#ffb7d5' : '#ff69b4';
    petal.style.background = `radial-gradient(ellipse at 30% 30%, ${hue}, #ff1493)`;
    overlay.appendChild(petal);
  }
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 2200);
}

function playArcticAnimation() {
  const container = document.createElement('div');
  container.className = 'aurora-container';
  for (let i = 0; i < 3; i++) {
    const wave = document.createElement('div');
    wave.className = 'aurora-wave';
    container.appendChild(wave);
  }
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 2500);
}

function playHeartsAnimation() {
  const hearts = ['❤️', '💕', '💗', '💖', '💓'];
  const count = 15 + Math.floor(Math.random() * 6); // 15-20
  const w = window.innerWidth;
  const h = window.innerHeight;

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    el.style.position = 'fixed';
    el.style.zIndex = '9999';
    el.style.pointerEvents = 'none';
    el.style.fontSize = (14 + Math.random() * 4) + 'px';

    // Random X avoiding center 30%
    let x;
    if (Math.random() < 0.5) {
      x = Math.random() * w * 0.35; // left 35%
    } else {
      x = w * 0.65 + Math.random() * w * 0.35; // right 35%
    }
    const startY = h * 0.5 + Math.random() * h * 0.4; // y: 50%-90%

    el.style.left = x + 'px';
    el.style.top = startY + 'px';
    el.style.opacity = '1';
    el.style.willChange = 'transform, opacity';
    document.body.appendChild(el);

    const duration = 2800 + Math.random() * 1200;
    const swayAmp = 18 + Math.random() * 18;
    const swayFreq = 1.2 + Math.random() * 1.2;
    const stagger = Math.random() * 600;

    setTimeout(() => {
      const startTime = performance.now();

      function animate(now) {
        const t = (now - startTime) / duration;
        if (t >= 1) { el.remove(); return; }

        const riseY = t * h * 0.65;
        const sway = Math.sin(t * Math.PI * 2 * swayFreq) * swayAmp;
        el.style.transform = `translate(${sway}px, ${-riseY}px)`;
        el.style.opacity = String(Math.max(0, 1 - t * 1.2));
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    }, stagger);
  }
}

function fireEasterEgg(type) {
  if (type === 'tokyo') playTokyoAnimation();
  else if (type === 'arctic') playArcticAnimation();
  else if (type === 'hearts') playHeartsAnimation();
}

async function handleTurnThenOpen(place) {
  // Detect easter egg
  const egg = detectEasterEgg(place);

  // Play door sounds immediately
  playDoorSounds();

  // Brief pause for the click sound
  await wait(200);

  // Fire easter egg AND open door simultaneously
  if (egg) fireEasterEgg(egg);
  openDoor(place);
}

// ── Google Maps API loader ──
function loadGoogleMapsAPI() {
  if (gmapsLoaded) return Promise.resolve();
  if (gmapsLoadPromise) return gmapsLoadPromise;
  gmapsLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GMAPS_API_KEY}`;
    script.async = true;
    script.onload = () => { gmapsLoaded = true; resolve(); };
    script.onerror = () => reject(new Error('Failed to load Google Maps API'));
    document.head.appendChild(script);
  });
  return gmapsLoadPromise;
}

// ── Geocode place name to coordinates ──
async function geocodePlace(place) {
  const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(place)}&key=${GMAPS_API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.status === 'OK' && data.results.length > 0) {
    return data.results[0].geometry.location; // { lat, lng }
  }
  return null;
}

// ── Show Street View panorama ──
async function showStreetView(place) {
  svLoading.style.display = 'flex';
  svPano.innerHTML = '';
  streetview.classList.add('active');

  try {
    // Load API and geocode in parallel
    const [, coords] = await Promise.all([loadGoogleMapsAPI(), geocodePlace(place)]);

    if (!coords) {
      showSVFallback(place, 'Could not find this location');
      return;
    }

    const location = new google.maps.LatLng(coords.lat, coords.lng);
    const svService = new google.maps.StreetViewService();

    svService.getPanorama({ location, radius: 500 }, (data, status) => {
      if (status === google.maps.StreetViewStatus.OK) {
        svLoading.style.display = 'none';
        currentPanorama = new google.maps.StreetViewPanorama(svPano, {
          position: data.location.latLng,
          pov: { heading: 0, pitch: 0 },
          zoom: 1,
          linksControl: true,
          panControl: true,
          enableCloseButton: false,
          fullscreenControl: false,
        });
      } else {
        showSVFallback(place, 'No street view available here');
      }
    });
  } catch (err) {
    showSVFallback(place, 'Failed to load Street View');
  }
}

function showSVFallback(place, message) {
  const encoded = encodeURIComponent(place);
  svLoading.innerHTML = `
    <div class="sv-fallback">
      <p>${message}</p>
      <a href="https://www.google.com/maps/search/${encoded}/@0,0,12z/data=!3m1!4b1" target="_blank">Open in Google Maps</a>
    </div>`;
}

let currentPanorama = null;
const returnDoor     = document.getElementById('returnDoor');
const doorCloseAnim  = document.getElementById('doorCloseAnim');

// ── Door close sound (reverse creak) ──
function playDoorCloseSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    // Reverb
    function makeReverb(duration, decay) {
      const len = ctx.sampleRate * duration;
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    const convolver = ctx.createConvolver();
    convolver.buffer = makeReverb(1.2, 3.5);
    const reverbGain = ctx.createGain();
    reverbGain.gain.value = 0.15;
    convolver.connect(reverbGain).connect(ctx.destination);

    // Reverse creak — sweeps downward
    const creakDur = 0.8;
    const creakOsc = ctx.createOscillator();
    creakOsc.type = 'sawtooth';
    creakOsc.frequency.setValueAtTime(500, now);
    creakOsc.frequency.exponentialRampToValueAtTime(140, now + creakDur);
    const creakOsc2 = ctx.createOscillator();
    creakOsc2.type = 'triangle';
    creakOsc2.frequency.setValueAtTime(320, now);
    creakOsc2.frequency.exponentialRampToValueAtTime(90, now + creakDur);
    const creakEnv = ctx.createGain();
    creakEnv.gain.setValueAtTime(0, now);
    creakEnv.gain.linearRampToValueAtTime(0.06, now + 0.1);
    creakEnv.gain.setValueAtTime(0.06, now + creakDur * 0.4);
    creakEnv.gain.linearRampToValueAtTime(0, now + creakDur);
    const creakFilter = ctx.createBiquadFilter();
    creakFilter.type = 'bandpass';
    creakFilter.frequency.setValueAtTime(500, now);
    creakFilter.frequency.exponentialRampToValueAtTime(180, now + creakDur);
    creakFilter.Q.value = 2;
    creakOsc.connect(creakFilter);
    creakOsc2.connect(creakFilter);
    creakFilter.connect(creakEnv);
    creakEnv.connect(ctx.destination);
    creakEnv.connect(convolver);
    creakOsc.start(now);
    creakOsc2.start(now);
    creakOsc.stop(now + creakDur);
    creakOsc2.stop(now + creakDur);

    // Latch click at the end
    const clickTime = now + creakDur - 0.05;
    const clickOsc = ctx.createOscillator();
    clickOsc.type = 'sine';
    clickOsc.frequency.setValueAtTime(220, clickTime);
    clickOsc.frequency.exponentialRampToValueAtTime(120, clickTime + 0.06);
    const clickEnv = ctx.createGain();
    clickEnv.gain.setValueAtTime(0, clickTime);
    clickEnv.gain.linearRampToValueAtTime(0.25, clickTime + 0.003);
    clickEnv.gain.exponentialRampToValueAtTime(0.001, clickTime + 0.06);
    clickOsc.connect(clickEnv);
    clickEnv.connect(ctx.destination);
    clickEnv.connect(convolver);
    clickOsc.start(clickTime);
    clickOsc.stop(clickTime + 0.06);
  } catch (e) { /* audio not available */ }
}

// ── Destroy panorama to avoid memory leaks ──
function destroyPanorama() {
  if (currentPanorama) {
    google.maps.event.clearInstanceListeners(currentPanorama);
    currentPanorama = null;
  }
  svPano.innerHTML = '';
}

// ── Leave street view (shared logic) ──
function leaveStreetView() {
  destroyPanorama();
  streetview.classList.remove('active');
  svLoading.style.display = 'flex';
  svLoading.innerHTML = '<div class="spinner"></div><span>Opening the door…</span>';
  resetLanding();
}

// ── Return door button — animated close ──
returnDoor.addEventListener('click', async () => {
  returnDoor.style.display = 'none'; // hide immediately, no door-in-door
  playDoorCloseSound();

  // Show close animation overlay on top of street view
  doorCloseAnim.classList.add('active');
  doorCloseAnim.classList.remove('closing', 'closed', 'shrinking');
  doorCloseAnim.style.transform = '';
  doorCloseAnim.style.opacity = '';
  void doorCloseAnim.offsetHeight;

  // Start door swing closed
  await wait(50);
  doorCloseAnim.classList.add('closing');

  // Wait for door to swing shut
  await wait(1000);

  // Fade to dark briefly
  doorCloseAnim.classList.add('closed');
  await wait(400);

  // Prepare landing page behind the close overlay (invisible)
  destroyPanorama();
  streetview.classList.remove('active');
  svLoading.style.display = 'flex';
  svLoading.innerHTML = '<div class="spinner"></div><span>Opening the door…</span>';

  // Reset landing state while hidden behind overlay
  doorAnim.classList.remove('active', 'entrance', 'swing', 'flash');
  placeInput.value = '';
  pickPlaceholder();
  showMarquee(true);
  openBtn.classList.remove('visible');
  doorWrapper.classList.remove('has-text');
  pickHint();
  lastHasText = false;
  isOpening = false;

  // Show landing at opacity 0, positioned and ready
  landing.classList.remove('hidden');
  landing.classList.add('returning');
  void landing.offsetHeight;

  // Shrink the close overlay from fullscreen to small door size
  doorCloseAnim.classList.add('shrinking');

  // Simultaneously fade in the landing page
  landing.classList.add('fade-in');

  // Wait for shrink + crossfade to finish
  await wait(900);

  // Clean up
  doorCloseAnim.classList.remove('active', 'closing', 'closed', 'shrinking');
  doorCloseAnim.style.transform = '';
  doorCloseAnim.style.opacity = '';
  landing.classList.remove('returning', 'fade-in');
  placeInput.focus();
});

function resetLanding() {
  returnDoor.style.display = ''; // restore for next street view visit
  doorAnim.classList.remove('active', 'entrance', 'swing', 'flash');
  landing.classList.remove('hidden');
  placeInput.value = '';
  pickPlaceholder();
  showMarquee(true);
  openBtn.classList.remove('visible');
  doorWrapper.classList.remove('has-text');
  pickHint();
  lastHasText = false;
  placeInput.focus();
  isOpening = false;
}

async function openDoor(place) {
  landing.classList.add('hidden');

  doorAnim.classList.add('active');
  doorAnim.classList.remove('entrance', 'swing', 'flash');
  void doorAnim.offsetHeight;

  // Trigger entrance animation — door materializes/approaches
  doorAnim.classList.add('entrance');

  // Wait for the entrance scale+fade transition to complete
  await wait(550);

  // Swing the door open
  doorAnim.classList.add('swing');

  // Let the door swing open and portal glow build up
  await wait(1000);

  // Step-through: portal light expands outward from the opening
  doorAnim.classList.add('flash');

  // Let the step-through light expand to fill the screen
  await wait(600);

  // Hide door animation, show Street View
  doorAnim.classList.remove('active', 'entrance', 'swing', 'flash');
  showStreetView(place);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Mobile virtual keyboard detection ──
(function() {
  const initialHeight = window.innerHeight;
  const THRESHOLD = 0.75; // keyboard likely open if viewport < 75% of initial

  function setKeyboardState(isOpen) {
    if (isOpen) {
      landing.classList.add('keyboard-open');
    } else {
      landing.classList.remove('keyboard-open');
    }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const ratio = window.visualViewport.height / initialHeight;
      setKeyboardState(ratio < THRESHOLD);
    });
  } else {
    window.addEventListener('resize', () => {
      const ratio = window.innerHeight / initialHeight;
      setKeyboardState(ratio < THRESHOLD);
    });
  }
})();

// ── Shooting stars (landing page only) ──
(function() {
  let timer = null;

  function spawnStar(opts) {
    if (landing.classList.contains('hidden')) return;

    const star = document.createElement('div');
    star.className = 'shooting-star';

    // 1 in 5 chance of a brighter star
    const bright = opts ? opts.bright : Math.random() < 0.2;
    if (bright) star.classList.add('bright');

    // Randomize tail length and peak opacity
    const tailLen = 200 + Math.random() * 150; // 200-350px
    const peak = opts ? opts.peak : (0.5 + Math.random() * 0.2);  // 0.5-0.7
    star.style.setProperty('--len', tailLen + 'px');
    star.style.setProperty('--peak', peak);

    // Start in upper-right quadrant
    const startX = opts ? opts.startX : (50 + Math.random() * 45); // 50-95% from left
    const startY = opts ? opts.startY : (Math.random() * 35);       // 0-35% from top

    // Angle 210-240 degrees (down-left)
    const angle = opts ? opts.angle : ((210 + Math.random() * 30) * Math.PI / 180);
    const dist = 200 + Math.random() * 150;
    const dx = Math.cos(angle) * dist;
    const dy = -Math.sin(angle) * dist; // CSS Y is inverted

    const duration = 0.8 + Math.random() * 0.4; // 0.8-1.2s

    star.style.left = startX + 'vw';
    star.style.top = startY + 'vh';
    star.style.setProperty('--dx', dx + 'px');
    star.style.setProperty('--dy', dy + 'px');
    star.style.setProperty('--duration', duration + 's');
    // Rotate so the bright head (right end) points in movement direction
    const rotDeg = Math.atan2(-dy, dx) * 180 / Math.PI;
    star.style.setProperty('--rot', (-rotDeg) + 'deg');

    document.body.appendChild(star);

    // Clean up after animation
    star.addEventListener('animationend', () => star.remove());
    // Fallback cleanup
    setTimeout(() => { if (star.parentNode) star.remove(); }, (duration + 0.5) * 1000);

    return { startX, startY, angle, bright, peak };
  }

  function spawnGroup() {
    const roll = Math.random();
    const info = spawnStar();
    if (!info) return;

    if (roll < 0.65) {
      // 65%: single star — already spawned
    } else if (roll < 0.90) {
      // 25%: 2-star pair, staggered
      const delay = 100 + Math.random() * 150; // 100-250ms
      const offX = (Math.random() - 0.5) * 6;  // ±3vw
      const offY = (Math.random() - 0.5) * 4;  // ±2vh
      setTimeout(() => spawnStar({
        startX: info.startX + offX,
        startY: info.startY + offY,
        angle: info.angle + (Math.random() - 0.5) * 0.08,
        bright: Math.random() < 0.2,
        peak: info.peak * (0.5 + Math.random() * 0.3)
      }), delay);
    } else {
      // 10%: 3-star mini shower, spread across upper screen
      for (let i = 1; i <= 2; i++) {
        const delay = i * (80 + Math.random() * 120); // 80-200ms each
        setTimeout(() => spawnStar({
          startX: 50 + Math.random() * 45,
          startY: Math.random() * 35,
          angle: info.angle + (Math.random() - 0.5) * 0.15,
          bright: Math.random() < 0.2,
          peak: 0.4 + Math.random() * 0.25
        }), delay);
      }
    }
  }

  function scheduleNext() {
    // Irregular timing: 65% short gaps (3-5s), 35% long pauses (8-14s)
    const delay = Math.random() < 0.65
      ? 3000 + Math.random() * 2000   // 3-5s
      : 8000 + Math.random() * 6000;  // 8-14s
    timer = setTimeout(() => {
      spawnGroup();
      scheduleNext();
    }, delay);
  }

  function startStars() {
    if (timer) return;
    scheduleNext();
  }

  function stopStars() {
    clearTimeout(timer);
    timer = null;
  }

  // Watch landing visibility
  const obs = new MutationObserver(() => {
    if (landing.classList.contains('hidden')) stopStars();
    else startStars();
  });
  obs.observe(landing, { attributes: true, attributeFilter: ['class'] });

  // Start immediately
  startStars();
})();
